<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RHK600 V1.4</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body><div id="map"></div><header><b>RHK600 V1.4</b></header><aside id="panel"><div class="ph"><b>路線及 POI</b><button id="close">×</button></div><h5>路線顯示</h5><div class="seg"><button data-mode="forward">去程</button><button data-mode="reverse">回程</button><button data-mode="full" class="on">全程</button></div><h5>OSM POI 類型</h5><div id="filters"></div><h5>ETA 到達時間</h5><div class="eta"><label>配速 km/h<input id="pace" type="number" min="1" max="60" step="0.5" value="18"></label><label>出發日期<input id="startDate" type="date" value="2026-10-23"></label><label>Start 出發時間<input id="t0" type="time" value="08:00"></label><label>CP5.5 出發時間<input id="cp55Departure" type="datetime-local" value="2026-10-24T06:00"></label><small>所有時間均為香港時間。CP5.5 預設於翌日（24-Oct-2026）06:00 出發。CP5.5 到達時間由起點及配速計算；CP5.5 之後的 ETA 由 CP5.5 出發時間計算。如預計到達遲於設定出發時間，將採用預計到達時間，避免時間倒流。關門時間保留於各 CP 描述下方。</small></div><button id="locate">◎ 我的定位</button><button id="fit">顯示所選路線</button><div id="status"></div></aside><div id="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="data/routes.js"></script><script src="app.js"></script></body></html>
