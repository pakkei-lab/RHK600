<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RHK600 V1.1</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body><div id="map"></div><header><b>RHK600 V1.1</b></header><aside id="panel"><div class="ph"><b>路線及 POI</b><button id="close">×</button></div><h5>路線顯示</h5><div class="seg"><button data-mode="forward">去程</button><button data-mode="reverse">回程</button><button data-mode="full" class="on">全程</button></div><h5>OSM POI 類型</h5><div id="filters"></div><h5>ETA 到達時間</h5><div class="eta"><label>配速 km/h<input id="pace" type="number" min="1" max="60" step="0.5" value="19"></label><label>出發日期<input id="startDate" type="date"></label><label>Start 出發時間<input id="t0" type="time" value="07:30"></label><label>CP3 出發（選填）<input id="t35" type="datetime-local"></label><label>CP5 出發（選填）<input id="t6" type="datetime-local"></label><label>CP7 出發（選填）<input id="t95" type="datetime-local"></label><small>日期及時間請按香港時間輸入。07:30 為沿用的可修改預設值，非官方出發時間。CP 關門時間已按先前提供的時間表及 CP 編號配對，顯示於描述下方。</small></div><button id="locate">◎ 我的定位</button><button id="fit">顯示所選路線</button><div id="status"></div></aside><div id="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="data/routes.js"></script><script src="app.js"></script></body></html>
